/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 5
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"
        common:
            lid_topic: "/livox/lidar"
            imu_topic: "/mavros/imu/data_raw"
            time_sync_en: true
            time_offset_lidar_to_imu: 0.0
        preprocess:
            lidar_type: 1
            scan_line: 6          # ← change to match your model
            blind: 0.8
            timestamp_unit: 
            scan_rate: 10
        mapping:
            acc_cov: 0.001        # ← fixed
            gyr_cov: 0.0001       # ← fixed
            b_acc_cov: 0.0001
            b_gyr_cov: 0.000001
            fov_degree: 360.0
            det_range: 100.0
            extrinsic_est_en: false   # ← fixed
            extrinsic_T: [ -0.1, 0.0, 0.17 ]
            extrinsic_R: [  0.707,  0.0,  0.707,
                            -0.0,  -1.0,  0.0,
                            0.707,  -0.0, -0.707 ]

                            
        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true
        pcd_save:
            pcd_save_en: true
            interval: -1
