/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"
        common:
            lid_topic: "/livox/lidar"
            #The telemetry/imu topic is using data from a flight controller. if using lidar's own imu set this to /livox/imu.
            imu_topic: "/telemetry/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0
        preprocess:
            lidar_type: 1
            scan_line: 6          
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10
        mapping:
            acc_cov: 0.001        
            gyr_cov: 0.0001       
            b_acc_cov: 0.0001
            b_gyr_cov: 0.000001
            fov_degree: 360.0
            det_range: 100.0
            extrinsic_est_en: false   
            #Rotate the lidar frame to the body frame. This tool can help orient the lidar frame to the body frame: 
            #https://articulatedrobotics.xyz/tools/rotation-calculator/
            #This is -180 degrees around x-axis and 45 degrees around y.
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [  0.707,  0.0,  0.707,
                            -0.0,  -1.0,  0.0,
                            0.707,  -0.0, -0.707 ]

                            
        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true
        pcd_save:
            pcd_save_en: true
            interval: -1